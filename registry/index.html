<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kybernesis eve registry</title>
<body style="font-family:system-ui,-apple-system,sans-serif;max-width:640px;margin:4rem auto;padding:0 1.5rem;line-height:1.65;color:#111">
  <h1 style="letter-spacing:-0.02em">Kybernesis eve registry</h1>
  <p>An integration registry for <a href="https://eve.dev">eve</a> agents, in the standard <a href="https://ui.shadcn.com/docs/registry">shadcn registry format</a>.</p>

  <h2 style="font-size:1.1rem;margin-top:2rem">Add the registry (once per project)</h2>
  <pre style="background:#f5f5f5;padding:1rem;border-radius:8px;overflow-x:auto">eve registry add @kybernesis=https://registry.kybernesis.ai/r/{name}.json</pre>

  <h2 style="font-size:1.1rem;margin-top:2rem">Items</h2>
  <div id="items"><p style="color:#555">Loading…</p></div>

  <p style="margin-top:2rem;font-size:0.9rem;color:#555">
    <a href="https://github.com/KybernesisAI/platform/tree/master/registry">Registry source</a>
  </p>

  <!--
    The list is rendered from r/registry.json rather than written out by hand.

    It used to be hand-maintained, and it drifted exactly the way hand-maintained
    lists do: two packages shipped, the JSON knew about them, and this page went
    on advertising six items. A catalogue that disagrees with the thing it
    catalogues is worse than no catalogue, because someone trusts it.
  -->
  <script>
    const escape = (value) =>
      String(value ?? "").replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
      );

    fetch("/r/registry.json", { cache: "no-store" })
      .then((res) => res.json())
      .then((registry) => {
        const items = registry.items ?? [];
        document.getElementById("items").innerHTML = items
          .map(
            (item) => `
              <p style="margin-bottom:4px">
                <strong>${escape(item.name)}</strong> — ${escape(item.description)}
              </p>
              <pre style="background:#f5f5f5;padding:0.6rem 1rem;border-radius:8px;overflow-x:auto;margin-top:0">eve add @kybernesis/${escape(item.name)}</pre>
            `,
          )
          .join("");
      })
      .catch(() => {
        document.getElementById("items").innerHTML =
          '<p style="color:#555">The catalogue could not be loaded. ' +
          '<a href="/r/registry.json">Read it directly</a>.</p>';
      });
  </script>
</body>
</html>
